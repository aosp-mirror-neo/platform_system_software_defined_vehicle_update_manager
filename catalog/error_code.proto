syntax = "proto3";

package com.android.sdv.update_manager;

enum ErrorCode {
  /* A value to capture the default value of the enum */
  Unspecified = 0;
  /* Indicates an error was received from UpdateEngine
   * The error message may include an error code from the following file:
   * https://cs.android.com/android/platform/superproject/main/+/main:system/update_engine/common/error_code.h
   */
  UpdateEngineError = 1;
  // Indicates an error was received from the ApexService
  ApexServiceError = 2;
  // Indicates an error was received from the BootControlService
  BootControlServiceError = 3;
  // Indicates an error was received from the VoldService
  VoldServiceError = 4;
}
