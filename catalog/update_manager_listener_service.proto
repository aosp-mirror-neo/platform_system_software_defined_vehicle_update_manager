syntax = "proto3";

package com.android.sdv.update_manager.client;

import "update_manager_status.proto";

service UpdateManagerListenerService {
  /* Called when there is a status update from the Update Manager.
   *
   * This must be implemented by all services that call
   * "SubscribeToStatusUpdates()" on the UpdateManagerService. */
  rpc OnStatusUpdate(OnStatusUpdateRequest) returns (OnStatusUpdateResponse) {}
}

/* This message has the same format as the IUpdateEngineCallback::onStatusUpdate
 * parameters. */
message UpdateProgress {
  /* Matches the enum UpdateStatus in the following Android source file:
   * https://cs.android.com/android/platform/superproject/main/+/main:system/update_engine/client_library/include/update_engine/update_status.h
   */
  int32 status_code = 1;

  /* A value ranging from 0.0 to 1.0, 0.0 representing no progress and 1.0
   * representing the process is complete. */
  float percentage = 2;
}

message OnStatusUpdateRequest {
  /* A status update can either be an UpdateManagerStatus or an UpdateProgress
   * message. UpdateManagerStatus is sent when the state has changed.
   * UpdateProgress is sent during system updates to indicate the update
   * progress. */
  oneof status_update {
    UpdateManagerStatus update_manager_status = 1;
    UpdateProgress update_progress = 2;
  }
}

message OnStatusUpdateResponse {}
